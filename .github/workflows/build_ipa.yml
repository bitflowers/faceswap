name: Build PicsiLive iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project PicsiLive.xcodeproj \
            -scheme PicsiLive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PicsiLive.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA Bundle
        run: |
          mkdir -p Payload/PicsiLive.app/models
          cp -r build/PicsiLive.xcarchive/Products/Applications/PicsiLive.app/* Payload/PicsiLive.app/
          
          # Download official InSwapper model directly into the bundle
          echo "Downloading InSwapper neural model..."
          curl -L -o Payload/PicsiLive.app/models/inswapper_128.onnx https://huggingface.co/ezioruan/inswapper_128.onnx/resolve/main/inswapper_128.onnx
          
          # Zip into valid IPA
          zip -r PicsiLive.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PicsiLive-iPhone-IPA
          path: PicsiLive.ipa
