name: Build PicsiLive iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project PicsiLive.xcodeproj \
            -scheme PicsiLive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PicsiLive.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/PicsiLive.xcarchive/Products/Applications/PicsiLive.app Payload/
          zip -r PicsiLive.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PicsiLive-iOS
          path: PicsiLive.ipa
